<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Новая вкладка</title>
<meta name="color-scheme" content="dark">
<style>
  :root { --bg:#0e1319; --card:rgba(24,33,44,.72); --card-hover:#1d2835; --line:#263241; --text:#e6edf5; --muted:#8696a9; --accent:#7cc4ff; --ws:#7cc4ff; }
  * { box-sizing:border-box }
  html, body { min-height:100%; margin:0 }
  body {
    background: radial-gradient(1100px 620px at 50% -12%, #1a2c43 0%, rgba(14,19,25,0) 70%), var(--bg);
    color:var(--text); font:15px/1.4 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; overflow-x:hidden;
  }
  canvas { position:fixed; inset:0; width:100%; height:100%; pointer-events:none }
  main { position:relative; max-width:900px; margin:0 auto; padding:10vh 24px 48px; display:flex; flex-direction:column; align-items:center }
  .ws { display:inline-flex; align-items:center; gap:8px; padding:5px 13px; border-radius:999px; background:color-mix(in srgb, var(--ws) 12%, transparent); color:var(--ws); font-size:13px; font-weight:600; letter-spacing:.02em }
  .ws i { width:8px; height:8px; border-radius:50%; background:var(--ws); box-shadow:0 0 10px var(--ws) }
  .clock { margin-top:18px; font-size:72px; font-weight:300; letter-spacing:-.03em; line-height:1; font-variant-numeric:tabular-nums }
  .date { margin-top:10px; color:var(--muted); font-size:15px }
  #search { margin-top:34px; width:100%; max-width:640px; position:relative }
  #search svg { position:absolute; left:19px; top:50%; transform:translateY(-50%); opacity:.7 }
  input { width:100%; border:1px solid var(--line); background:rgba(22,30,40,.92); color:var(--text); font:inherit; outline:none; transition:border-color .15s, box-shadow .15s }
  input:focus { border-color:var(--accent); box-shadow:0 0 0 4px rgba(124,196,255,.14) }
  input::placeholder { color:#6b7b8f }
  #q { height:54px; border-radius:27px; padding:0 22px 0 52px; font-size:16px }
  .tiles { margin-top:40px; display:grid; grid-template-columns:repeat(auto-fill, minmax(116px, 1fr)); gap:14px; width:100%; max-width:780px }
  .tile { position:relative; display:flex; flex-direction:column; align-items:center; gap:10px; padding:18px 8px 14px; border-radius:18px; background:var(--card); border:1px solid transparent; color:var(--text); text-decoration:none; transition:transform .15s, background .15s, border-color .15s; font:inherit; cursor:pointer }
  .tile:hover { background:var(--card-hover); border-color:var(--line); transform:translateY(-2px) }
  .ico { width:46px; height:46px; border-radius:14px; display:grid; place-items:center; overflow:hidden; font-weight:650; font-size:19px; color:#0e1319 }
  .ico.img { background:#eef3f8 }
  .ico img { width:28px; height:28px }
  .name { font-size:12.5px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#cdd7e3 }
  .del { position:absolute; top:7px; right:7px; width:22px; height:22px; border:0; border-radius:50%; background:#2a3747; color:#aab6c5; cursor:pointer; opacity:0; transition:opacity .15s; font-size:14px; line-height:22px; padding:0 }
  .tile:hover .del { opacity:1 }
  .del:hover { background:#3a4a5e; color:#fff }
  .add .ico { background:transparent; border:1.5px dashed #3a4b60; color:var(--muted); font-weight:300; font-size:26px }
  .addform { display:none; margin-top:18px; width:100%; max-width:640px; gap:10px }
  .addform.open { display:flex }
  .addform input { height:42px; border-radius:12px; padding:0 14px; font-size:14px }
  .addform input:first-child { max-width:200px }
  .addform button { height:42px; border-radius:12px; border:0; padding:0 18px; background:var(--accent); color:#0e1319; font:inherit; font-weight:600; cursor:pointer; white-space:nowrap }
  .hint { margin-top:44px; color:#6b7b8f; font-size:12.5px; text-align:center; line-height:2 }
  kbd { font:12px "Segoe UI",sans-serif; padding:2px 7px; border-radius:6px; background:#1c2633; border:1px solid #2a3747; color:#aab6c5 }
</style>
</head>
<body>
<canvas id="snow"></canvas>
<main>
  <div class="ws"><i></i><span id="wsName"></span></div>
  <div class="clock" id="clock"></div>
  <div class="date" id="date"></div>
  <form id="search" autocomplete="off">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#aab6c5" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" placeholder="Поиск или адрес сайта">
  </form>
  <div class="tiles" id="tiles"></div>
  <form class="addform" id="addform" autocomplete="off">
    <input id="addTitle" placeholder="Название">
    <input id="addUrl" placeholder="Адрес, например youtube.com">
    <button type="submit">Добавить</button>
  </form>
  <div class="hint">
    <kbd>Ctrl</kbd> <kbd>K</kbd> поиск по вкладкам, истории и командам &nbsp;·&nbsp;
    <kbd>Ctrl</kbd> <kbd>D</kbd> добавить открытую страницу сюда &nbsp;·&nbsp;
    <kbd>Alt</kbd> <kbd>1–9</kbd> пространства
  </div>
</main>
<script>
const DATA = /*__DATA__*/null;
(() => {
  const D = DATA || { search: 'https://www.google.com/search?q={0}', engine: 'Google', workspaces: [] };
  const params = new URLSearchParams(location.search);
  const ws = D.workspaces.find(w => w.id === params.get('ws')) || D.workspaces[0] || { id: '', name: '', accent: '#7cc4ff', links: [] };
  const $ = id => document.getElementById(id);

  document.documentElement.style.setProperty('--ws', ws.accent);
  $('wsName').textContent = ws.name;
  $('q').placeholder = `Поиск в ${D.engine} или адрес сайта`;

  const post = m => { try { window.chrome.webview.postMessage(m); } catch (e) { } };
  const hasScheme = s => /^[a-z][a-z0-9+.-]*:\/\//i.test(s);
  const isLocal = s => /^(localhost|127\.0\.0\.1)(:\d+)?([/?#].*)?$/i.test(s);
  const looksUrl = s => hasScheme(s) || isLocal(s) || (!/\s/.test(s) && /^[^\s/?#]+\.[a-zа-яё]{2,}(:\d+)?([/?#].*)?$/i.test(s));
  const normalize = s => { s = s.trim(); if (!s) return ''; if (hasScheme(s)) return s; return (isLocal(s) ? 'http://' : 'https://') + s; };

  $('search').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('q').value.trim();
    if (!v) return;
    location.href = looksUrl(v) ? normalize(v) : D.search.replace('{0}', encodeURIComponent(v));
  });

  const hue = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
  const tiles = $('tiles');

  function tile(l) {
    const a = document.createElement('a');
    a.className = 'tile'; a.href = l.url; a.title = `${l.title}\n${l.url}`;
    const ico = document.createElement('div');
    ico.className = 'ico';
    const letter = () => {
      ico.classList.remove('img');
      ico.style.background = `hsl(${hue(l.host || l.title)} 70% 72%)`;
      ico.textContent = (l.title || l.host || '?').trim().charAt(0).toUpperCase();
    };
    if (l.fav) {
      ico.classList.add('img');
      const img = new Image(); img.alt = ''; img.src = l.fav;
      img.onerror = () => { img.remove(); letter(); };
      ico.append(img);
    } else letter();
    const name = document.createElement('div');
    name.className = 'name'; name.textContent = l.title;
    const del = document.createElement('button');
    del.className = 'del'; del.title = 'Убрать со стартовой'; del.textContent = '×';
    del.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      post({ cmd: 'removeLink', ws: ws.id, url: l.url });
      a.remove();
    });
    a.append(ico, name, del);
    return a;
  }

  const add = document.createElement('button');
  add.className = 'tile add'; add.type = 'button';
  add.innerHTML = '<div class="ico">+</div><div class="name">Добавить</div>';
  add.addEventListener('click', () => { $('addform').classList.toggle('open'); $('addUrl').focus(); });
  ws.links.forEach(l => tiles.append(tile(l)));
  tiles.append(add);

  $('addform').addEventListener('submit', e => {
    e.preventDefault();
    const url = normalize($('addUrl').value);
    if (!url) return;
    let host = '';
    try { host = new URL(url).hostname.replace(/^www\./, ''); } catch { return; }
    const title = $('addTitle').value.trim() || host;
    post({ cmd: 'addLink', ws: ws.id, title, url });
    tiles.insertBefore(tile({ title, url, host }), add);
    $('addTitle').value = $('addUrl').value = '';
    $('addform').classList.remove('open');
  });

  const clock = () => {
    const d = new Date();
    $('clock').textContent = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    const s = d.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
    $('date').textContent = s.charAt(0).toUpperCase() + s.slice(1);
  };
  clock(); setInterval(clock, 5000);

  // Лёгкий снег. Останавливается сам, когда вкладка скрыта.
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const c = $('snow'), x = c.getContext('2d');
    let W = 0, H = 0, last = performance.now();
    const resize = () => { W = c.width = innerWidth * devicePixelRatio; H = c.height = innerHeight * devicePixelRatio; };
    resize(); addEventListener('resize', resize);
    const flakes = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.6 + .6, s: Math.random() * .25 + .08, d: Math.random() * 6.28 }));
    const tick = t => {
      const dt = Math.min(50, t - last) / 16.7; last = t;
      x.clearRect(0, 0, W, H);
      x.fillStyle = 'rgba(220,236,255,.5)';
      for (const f of flakes) {
        f.y += f.s * dt * .005; f.d += .01 * dt; f.x += Math.sin(f.d) * .0003 * dt;
        if (f.y > 1.02) { f.y = -.02; f.x = Math.random(); }
        x.beginPath(); x.arc(f.x * W, f.y * H, f.r * devicePixelRatio, 0, 6.283); x.fill();
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
